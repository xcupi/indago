name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      INDAGO_CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Verify dependencies and required runtime
        shell: bash
        run: |
          set -euo pipefail
          go mod verify
          command -v node
          node --version
          test -x "$INDAGO_CHROMIUM_PATH"
          "$INDAGO_CHROMIUM_PATH" --version
          export PLAYWRIGHT_NODEJS_PATH="$(command -v node)"
          echo "PLAYWRIGHT_NODEJS_PATH=$PLAYWRIGHT_NODEJS_PATH" >> "$GITHUB_ENV"
          # Same driver-only procedure as docs/deployment.md; no npm browser downloader.
          module_version=$(go list -m -f '{{.Version}}' github.com/mxschmitt/playwright-go)
          go run "github.com/mxschmitt/playwright-go/cmd/playwright@$module_version" --version
          python3 scripts/ci-browser-check.py
      - name: Clean-cache quality gate and binary build
        shell: bash
        run: |
          set -euo pipefail
          go clean -testcache
          make check 2>&1 | tee ci-check.log
          make build
      - name: Keep failure log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-failure-log
          path: ci-check.log
          if-no-files-found: ignore
          retention-days: 7
