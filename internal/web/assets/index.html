<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Indago</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/dashboard">INDAGO</a>
    <span class="ver" id="version">…</span>
    <div class="project-picker">
      <label for="projectSelect">Project</label>
      <select id="projectSelect"><option value="">— select a project —</option></select>
    </div>
  </header>

  <div class="shell">
    <nav class="sidebar" id="sidebar" aria-label="Main">
      <a href="#/dashboard" id="nav-dashboard" data-nav="dashboard">Dashboard</a>
      <a href="#/projects" id="nav-projects" data-nav="projects">Projects</a>
      <a href="#/targets" id="nav-targets" data-nav="targets">Targets</a>
      <a href="#/scope" id="nav-scope" data-nav="scope">Scope</a>
      <a href="#/scans" id="nav-scans" data-nav="scans">Scans</a>
      <a href="#/findings" id="nav-findings" data-nav="findings">Findings</a>
      <a href="#/reports" id="nav-reports" data-nav="reports">Reports</a>
      <a href="#/settings" id="nav-settings" data-nav="settings">Settings</a>
    </nav>

    <main class="content">
      <div id="error" class="err" role="alert"></div>
      <div id="view"></div>
    </main>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-box">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button id="modalClose" aria-label="Close">×</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <footer class="footer">
    Indago — local-first, single-user web application security hunting platform. Authorized use only.
    Reflected XSS is discovered <em>and</em> verified in a real browser; results are backed by stored evidence.
  </footer>

  <script src="app.js"></script>
  <script src="scans.js"></script>
  <script src="views.js"></script>
</body>
</html>
