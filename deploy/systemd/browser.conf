# Optional /etc/systemd/system/indago.service.d/browser.conf
# Provision compatible Node (>=20), Chromium and the go.mod-matched driver first.
[Service]
Environment=INDAGO_CHROMIUM_PATH=/usr/bin/chromium
Environment=PLAYWRIGHT_NODEJS_PATH=/usr/bin/node
Environment=PLAYWRIGHT_DRIVER_PATH=/var/cache/indago/playwright
ExecStart=
ExecStart=/usr/local/bin/indago serve -data /var/lib/indago -addr 127.0.0.1:8750 -browser
# No extra namespace/syscall/JIT restrictions are added. Existing Playwright
# launch defaults disable Chromium's sandbox; see deployment.md isolation limits.
